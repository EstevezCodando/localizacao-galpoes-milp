[project]
name = "alocacao-capacitada"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "J Estevez", email = "jean.alvarez@al.infnet.edu.br" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "highspy>=1.15.1",
    "numpy>=2.5.3",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyogrio>=0.13.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
alocacao-capacitada = "alocacao_capacitada.benchmark:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
pesquisa = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pyscipopt>=6.2.1",
    "torch>=2.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
strict = true
ignore_missing_imports = true
